[project]
name = "rag-agent"
version = "0.1.0"
description = "Financial AI Multi-Agent Assistant with FastAPI and Streamlit"
readme = "README.md"
authors = [
    { name = "RUSHIPATIL2003", email = "rushipatil2501@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.115.0",
    "google-generativeai>=0.8.6",
    "groq>=1.7.0",
    "httpx>=0.27.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "openai>=3.6.0",
    "packaging>=26.3",
    "phidata>=2.7.10",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.3",
    "redis>=5.0.0",
    "streamlit>=1.38.0",
    "uvicorn>=0.30.0",
    "yfinance>=1.7.0",
]

[project.scripts]
rag-agent = "rag_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
